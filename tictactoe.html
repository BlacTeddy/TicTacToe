<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <!-- ✕ ◯ -->
    <div id="display">
        <h1>Tic Tac Toe</h1>
        <h3>Player <span id="currentPlayer"></span>'s Turn </h3>
        <div id="board">
            <div class="square" id="a1"></div>
            <div class="square" id="a2"></div>
            <div class="square" id="a3"></div>
            <div class="square" id="a4"></div>
            <div class="square" id="a5"></div>
            <div class="square" id="a6"></div>
            <div class="square" id="a7"></div>
            <div class="square" id="a8"></div>
            <div class="square" id="a9"></div>
        </div>
        <button id="restart">New Game</button>
    </div>
    <div id="alert"><div id="box"><h3 id="result">Congradulation!</h3><p id="no">Player <span id="winingPlayer"></span> Won</p> </div></div>
    <script type="module" src="./dist/src/tictactoe.js" defer></script>
</body>
</html>
